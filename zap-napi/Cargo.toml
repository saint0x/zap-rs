[package]
name = "zap-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
zap-core = { path = "../zap-core" }
zap-server = { path = "../zap-server" }
napi = { version = "2.16", default-features = false, features = ["napi4", "serde-json", "tokio_rt"] }
napi-derive = "2.16"
tokio = { workspace = true, features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tracing = "0.1"

[build-dependencies]
napi-build = "2.1"
